
volumes:
  timescaledb_home_data:
  timescaledb_home_log:

services: 

  # # Jaeger
  # jaeger-all-in-one:
  #   image: jaegertracing/all-in-one:latest
  #   restart: always
  #   ports:
  #     - "16686:16686"
  #     - "14268"
  #     - "14250"


  vector:
    image: timberio/vector:0.46.X-alpine
#    ports:
#      - "0.0.0.0:4317:4317"   # OTLP gRPC receiver
#      - "0.0.0.0:4318:4318"   # OTLP http/protobuf receiver
#      - 8686:8686
    volumes:
      - ./datadir/analytics/vector.yml:/etc/vector/vector.yaml:ro
    env_file:
      - .envs-analytics

  timescaledb:
    image: timescale/timescaledb-ha:pg18
    ports:
      - 5433:5432
    env_file:
      - .envs-analytics
    volumes:
      - timescaledb_home_data:/home/postgres/pgdata
      - timescaledb_home_log:/home/postgres/pg_log

      - ./datadir/analytics/db.entrypoints.d:/docker-entrypoint-initdb.d/:ro
    restart: always

  analytics:
    image: georchestra/analytics-cli:2.1.0
    volumes:
      - "./datadir:/etc/georchestra"
    environment:
       - DB_SECRET=password
    command:
        - "analytics-cli"
        - "--config-file"
        - "/etc/georchestra/analytics/config/config.yaml"
        - "buffer2db"
        - "--cron"
        - "* * * * *"
    depends_on:
      - vector
      - timescaledb
